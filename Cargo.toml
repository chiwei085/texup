[package]
name = "texup"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Cargo-like TeX Live management for LaTeX projects: per-project year, lockfile, on-demand packages"
license = "MIT"
repository = "https://github.com/chiwei085/texup"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Keep `deps` in sync with the dependency table in README.md (plus gcc for cargo).
  e2e:
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu x86_64
            os: ubuntu-latest
          - name: ubuntu arm64
            os: ubuntu-24.04-arm
          - name: debian
            os: ubuntu-latest
            container: debian:stable
            deps: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl perl xz-utils fontconfig gcc libc6-dev
          - name: fedora
            os: ubuntu-latest
            container: fedora:latest
            deps: dnf install -y curl perl xz tar fontconfig gcc
          - name: arch
            os: ubuntu-latest
            container: archlinux:latest
            deps: pacman -Syu --noconfirm curl perl xz tar fontconfig gcc
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - if: matrix.deps
        run: ${{ matrix.deps }}
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install texweft
        shell: bash
        env:
          VERSION: v0.1.1
          SHA256_x86_64: f375afae929a8311cffa929cca9b238140e24724a55ae12df75b03f6554ec8bf
          SHA256_aarch64: 66ba1336326d066d9f002a40cb0e495b4fb7857c921db2c93eb82d785423d959
        run: |
          arch=$(uname -m)
          sum_var="SHA256_$arch"
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/texweft" \
            "https://github.com/chiwei085/texweft/releases/download/$VERSION/texweft-$arch-linux"
          echo "${!sum_var}  $HOME/.local/bin/texweft" | sha256sum -c -
          chmod +x "$HOME/.local/bin/texweft"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/texweft" --version
      - uses: actions/cache@v6
        with:
          path: ~/.cache/texup
          key: texup-${{ matrix.name }}-${{ hashFiles('tests/e2e/*/texup.lock') }}
      - run: cargo build
      - name: Build each engine with --locked
        shell: bash
        run: |
          # A cold LuaTeX font database must not add unrelated packages to the lockfile.
          rm -rf "$HOME/.cache/texup/tl/2025"/{texmf-var,home-var}/luatex-cache
          for e in pdflatex xelatex lualatex; do
            target/debug/texup build --locked "tests/e2e/$e"
            test -f "tests/e2e/$e/main.pdf"
          done
